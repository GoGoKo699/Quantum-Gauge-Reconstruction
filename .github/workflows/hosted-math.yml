name: Hosted mathematics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install isolated rendering dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/math-runtime/node_modules/.bin/playwright" install --with-deps chromium

      - name: Probe representative inline display and table mathematics
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted/probe_hosted_math.cjs --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --revision "$(git rev-parse HEAD)" --page README.md --output "$RUNNER_TEMP/math-evidence/probe"

      - name: Compare every Markdown page at both viewports
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --revision "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/math-evidence/full"

      - name: Save rendering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/math-evidence
          if-no-files-found: warn
          retention-days: 14

